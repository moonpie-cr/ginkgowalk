<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>银杏大道 · 十二个月的记忆</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f6ecd6;
  --panel:rgba(255,249,236,.90);
  --panel-strong:rgba(255,249,236,.97);
  --surface:rgba(120,90,40,.06);
  --overlay:rgba(246,226,186,.72);
  --listen:rgba(120,80,20,.34);
  --text:#3b2a14;
  --text-2:#7a6142;
  --line:rgba(120,90,40,.22);
  --accent:#d99a12;
  --accent-2:#b5651d;
  --on-accent:#ffffff;
  --track:rgba(120,90,40,.18);
  --shadow:rgba(60,40,10,.22);
  --white:rgba(255,255,255,.9);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#232323; --panel:rgba(35,31,26,.90); --panel-strong:rgba(35,31,26,.97);
    --surface:rgba(255,255,255,.06); --overlay:rgba(20,16,10,.74); --listen:rgba(0,0,0,.45);
    --text:#f3e7cf; --text-2:#bfa984; --line:rgba(240,200,120,.18);
    --accent:#f0b429; --accent-2:#e08a3c; --on-accent:#2a1c06;
    --track:rgba(240,200,120,.16); --shadow:rgba(0,0,0,.45); --white:rgba(255,255,255,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#232323; --panel:rgba(35,31,26,.90); --panel-strong:rgba(35,31,26,.97);
  --surface:rgba(255,255,255,.06); --overlay:rgba(20,16,10,.74); --listen:rgba(0,0,0,.45);
  --text:#f3e7cf; --text-2:#bfa984; --line:rgba(240,200,120,.18);
  --accent:#f0b429; --accent-2:#e08a3c; --on-accent:#2a1c06;
  --track:rgba(240,200,120,.16); --shadow:rgba(0,0,0,.45); --white:rgba(255,255,255,.85);
}
:root[data-theme="light"]{
  --bg:#f6ecd6; --panel:rgba(255,249,236,.90); --panel-strong:rgba(255,249,236,.97);
  --surface:rgba(120,90,40,.06); --overlay:rgba(246,226,186,.72); --listen:rgba(120,80,20,.34);
  --text:#3b2a14; --text-2:#7a6142; --line:rgba(120,90,40,.22);
  --accent:#d99a12; --accent-2:#b5651d; --on-accent:#ffffff;
  --track:rgba(120,90,40,.18); --shadow:rgba(60,40,10,.22); --white:rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel-strong);color:var(--text);
  border-radius:999px;padding:8px 14px;transition:border-color .2s,background .2s}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.97)}

/* ---------- 开始界面 ---------- */
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--overlay);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:20;transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
.start-box{max-width:470px;width:calc(100% - 40px);text-align:center;padding:26px 24px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 60px var(--shadow);max-height:calc(100% - 40px);overflow:auto}
.start-box .leaf{font-size:42px;animation:sway 3.4s ease-in-out infinite;display:inline-block}
.start-box h1{margin:4px 0 4px;font-size:25px;letter-spacing:3px}
.start-box .sub{color:var(--text-2);margin:0 0 16px;font-size:13.5px;line-height:1.6}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;text-align:left;font-size:12.5px;color:var(--text-2);
  margin:0 auto 18px;max-width:350px}
.keys b{color:var(--text);font-weight:600;white-space:nowrap}
#go{background:var(--accent);color:var(--on-accent);border:none;padding:12px 34px;font-size:16px;font-weight:600;
  box-shadow:0 6px 18px var(--shadow)}
@keyframes sway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

#cardPhoto{height:196px;background-size:cover;background-position:center;background-color:var(--track);position:relative;overflow:hidden}
.art-label{position:absolute;right:12px;top:10px;padding:4px 8px;border-radius:999px;background:var(--panel);color:var(--text-2);font-size:10px;letter-spacing:1px}
#finaleCaption{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);opacity:0;transition:opacity 1.2s,transform 1.2s;z-index:5;text-align:center;color:var(--text);text-shadow:0 2px 14px var(--shadow);pointer-events:none}
#finaleCaption.show{opacity:1;transform:translate(-50%,0)}
#finaleCaption span,#finaleCaption small{display:block;color:var(--text-2);font-size:12px;letter-spacing:2px}
#finaleCaption b{display:block;font-size:26px;letter-spacing:8px;margin:5px 0;color:var(--accent)}

.auto-row{display:none;align-items:center;gap:10px;margin-top:12px}
.auto-row.show{display:flex}
#btnNext{background:var(--accent);color:var(--on-accent);border:none;font-weight:600;padding:8px 16px}
#autoCount{font-size:11.5px;color:var(--text-2)}
#btnAuto.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* ---------- 顶部进度 ---------- */
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(540px,calc(100% - 130px));z-index:5;
  padding:9px 14px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 6px 20px var(--shadow);opacity:0;transition:opacity .6s}
#hud.show{opacity:1}
.hud-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:7px}
.hud-row b{color:var(--text)}
#track{position:relative;height:6px;border-radius:6px;background:var(--track)}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:var(--accent);transition:width .15s}
.dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;
  background:var(--panel-strong);border:2px solid var(--accent-2);transition:all .3s}
.dot.on{background:var(--accent-2);transform:scale(1.25)}

/* ---------- 记忆卡片 ---------- */
#card{position:fixed;right:18px;bottom:18px;width:min(350px,calc(100% - 36px));z-index:6;border-radius:16px;overflow:hidden;
  background:var(--panel-strong);border:1px solid var(--line);box-shadow:0 16px 40px var(--shadow);
  opacity:0;transform:translateY(20px) scale(.97);pointer-events:none;transition:opacity .45s,transform .45s}
#card.show{opacity:1;transform:none;pointer-events:auto}
#cardPhoto{position:relative;height:196px;background-size:cover;background-position:center;background-color:var(--track);
  display:flex;align-items:center;justify-content:center}
#photoEmpty{font-size:12px;color:var(--text-2);text-align:center;padding:0 26px;line-height:1.7}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;padding:0;border-radius:50%;
  display:none;align-items:center;justify-content:center;font-size:15px;background:var(--panel);opacity:.92}
.nav.show{display:flex}
.nav.prev{left:8px}.nav.next{right:8px}
#photoDots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:none;gap:5px}
#photoDots.show{display:flex}
#photoDots i{width:6px;height:6px;border-radius:50%;background:var(--white);opacity:.45;box-shadow:0 0 4px var(--shadow)}
#photoDots i.on{opacity:1;background:var(--accent)}
.card-body{padding:12px 16px 14px}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--accent-2);font-weight:600}
#cardTitle{margin:6px 0 6px;font-size:17px;line-height:1.35}
#cardText{margin:0;font-size:13.5px;line-height:1.72;color:var(--text-2);white-space:pre-wrap}
.actions{display:flex;gap:7px;margin-top:11px;align-items:center;flex-wrap:wrap}
.actions button{padding:6px 11px;font-size:12.5px}
.hint{font-size:11px;color:var(--text-2);margin-top:8px;opacity:.85;line-height:1.5}

/* 音乐条 */
.music{display:flex;align-items:center;gap:9px;margin-top:11px;padding:8px 10px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line)}
.music .play{width:32px;height:32px;border-radius:50%;padding:0;font-size:13px;background:var(--accent);
  color:var(--on-accent);border:none;flex:none;display:flex;align-items:center;justify-content:center}
.music .name{flex:1;min-width:0;font-size:12.5px;line-height:1.3;overflow:hidden}
.music .name small{display:block;font-size:10.5px;color:var(--text-2);margin-top:2px}
.music .mini{width:26px;height:26px;padding:0;font-size:12px;flex:none;display:flex;align-items:center;justify-content:center}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px;width:16px;flex:none}
.eq i{width:3px;height:25%;background:var(--accent);border-radius:2px}
.eq.on i{animation:eq .85s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.22s}
.eq.on i:nth-child(3){animation-delay:.44s}
@keyframes eq{0%,100%{height:22%}50%{height:100%}}

/* 编辑面板 */
#editor{display:none;padding:12px 16px 14px}
#editor.show{display:block}
#editor label{display:block;font-size:11px;color:var(--text-2);margin:0 0 3px}
#editor input,#editor textarea{width:100%;font:inherit;font-size:13.5px;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:9px;resize:vertical;
  -webkit-user-select:text;user-select:text}
#editor textarea{min-height:86px;line-height:1.6}
#editor .ed-actions{display:flex;gap:8px}
#editor .ed-actions button{flex:1;justify-content:center;padding:8px}
#eSave{background:var(--accent);color:var(--on-accent);border:none;font-weight:600}

/* 正在播放 */
#now{position:fixed;right:16px;top:16px;z-index:8;display:flex;align-items:center;gap:9px;
  padding:7px 9px 7px 12px;border-radius:999px;background:var(--panel-strong);border:1px solid var(--line);
  box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(-10px);pointer-events:none;transition:.35s;max-width:62vw}
#now.show{opacity:1;transform:none;pointer-events:auto}
#now span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#now button{width:26px;height:26px;padding:0;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}

/* 听歌氛围 */
#listen{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.4s;
  background:radial-gradient(circle at 50% 42%,transparent 28%,var(--listen) 100%)}
#listen.show{opacity:1}

/* 工具 & 提示 */
#tools{position:fixed;left:16px;top:16px;z-index:6;display:flex;gap:7px;opacity:0;transition:opacity .6s}
#tools.show{opacity:1}
#tools button{width:36px;height:36px;padding:0;font-size:15px}
#pause{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;padding:9px 16px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;display:none;pointer-events:none;text-align:center}
#toast{position:fixed;left:50%;top:86px;transform:translate(-50%,-10px);z-index:9;padding:8px 16px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;opacity:0;transition:all .4s;pointer-events:none;
  max-width:86vw;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--panel-strong);
  opacity:.75;z-index:4;display:none}

/* 手机摇杆 */
#stick{position:fixed;width:108px;height:108px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
  opacity:.72;z-index:6;display:none;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--accent)}
#touchHint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:var(--text);z-index:5;
  display:none;text-shadow:0 1px 3px var(--shadow)}

@media (pointer:coarse), (max-width:700px){
  #card{right:auto;left:50%;bottom:auto;top:88px;transform:translate(-50%,-10px) scale(.97);
    width:min(370px,calc(100% - 20px));max-height:calc(100% - 190px);overflow:auto}
  #card.show{transform:translate(-50%,0)}
  #cardPhoto{height:150px}
  #tools{top:auto;bottom:14px;left:14px}
  #hud{width:calc(100% - 130px)}
  .hint{display:none}
}
</style>
<script type="importmap">

</script>
</head>
<body>

<div id="start">
  <div class="start-box">
    <div class="leaf">🍂</div>
    <h1>银杏大道</h1>
    <p class="sub">十二块记忆路牌，一整个年头。<br>走到路牌前，停下来听那一个月的声音。</p>
    <div class="keys" id="keysDesk">
      <b>W A S D / ↑↓←→</b><span>走路</span>
      <b>鼠标</b><span>环顾四周</span>
      <b>Shift</b><span>小跑</span>
      <b>M</b><span>播放 / 暂停当月歌曲</span>
      <b>M</b><span>播放 / 暂停当月旋律</span>
      <b>Tab / Esc</b><span>释放鼠标</span>
    </div>
    <div class="keys" id="keysTouch" style="display:none">
      <b>左半屏拖动</b><span>走路（推到底是小跑）</span>
      <b>右半屏拖动</b><span>环顾四周</span>
      <b>路牌卡片</b><span>点 ▶ 听当月旋律</span>
    </div>
    <button id="go">开始漫步</button>
  </div>
</div>

<div id="hud">
  <div class="hud-row"><span>已走 <b id="meters">0</b> 米</span><span>记忆路牌 <b id="found">0</b> / <b id="total">0</b></span></div>
  <div id="track"><div id="fill"></div></div>
</div>

<div id="tools">
  <button id="btnSound" title="声音开关">🔊</button>
  <button id="btnAuto" title="自动漫步 / 手动行走">🚶</button>
  
</div>

<div id="now">
  <div class="eq on"><i></i><i></i><i></i></div>
  <span id="nowTitle">正在播放</span>
  <button id="nowToggle" title="暂停">⏸</button>
</div>

<div id="card">
  <div id="cardPhoto">
    <div class="art-label" id="artLabel"></div>
  </div>
  <div class="card-body" id="cardBody">
    <div class="meta"><span id="cardNo"></span><span id="cardDate"></span></div>
    <h3 id="cardTitle"></h3>
    <p id="cardText"></p>
    <div class="music">
      <button class="play" id="playBtn">▶</button>
      <div class="name" id="songName">当月歌曲<small>点 ▶ 停下来听一会儿</small></div>
      <div class="eq" id="eq"><i></i><i></i><i></i></div>

    </div>
    <div class="auto-row" id="autoRow"><button id="btnNext">继续漫步 →</button><span id="autoCount"></span></div>
    <div class="hint" id="cardHint">点 ▶ 听当月旋律 · 空格键继续</div>
  </div>

</div>

<div id="listen"></div>
<div id="pause">点击画面继续漫步</div>
<div id="toast"></div>
<div id="cross"></div>
<div id="stick"><div id="knob"></div></div>
<div id="touchHint">左边拖动走路 · 右边拖动看风景</div>
<div id="finale"></div><div id="finaleCaption"><span>这一年的路，走到了这里</span><b>渐入佳境</b><small>风还会吹起新的叶子</small></div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   十二个月的内容：可以直接在网页里改（改完存在浏览器里），
   也可以在这里写死，发给朋友时就是你写的样子。
   ============================================================ */
const MONTHS = [
  { title:'一月 · 初雪', date:'2026.01', emoji:'❄️', sky:['#b9d3ee','#eef3f8'],
    text:'推开窗，整座城忽然安静了。\n楼下的雪还没被人踩过，白得发亮。' },
  { title:'二月 · 早梅', date:'2026.02', emoji:'🌸', sky:['#f3c2cf','#fdf0f3'],

  { title:'三月 · 樱花', date:'2026.03', emoji:'🌷', sky:['#f5bfd0','#fdeef2'],

  { title:'四月 · 新绿', date:'2026.04', emoji:'🌱', sky:['#a8cf8a','#eef7e2'],
    text:'树开始重新长叶子，\n骑车的那条路一下就有了光。' },
  { title:'五月 · 海风', date:'2026.05', emoji:'🌊', sky:['#76c0e2','#e9f6fb'],
    text:'第一次一个人去看海。\n带的书一页没看，光顾着听浪。' },
  { title:'六月 · 梅雨', date:'2026.06', emoji:'☔', sky:['#8fa5b8','#e6eef4'],
    text:'连着下了半个月的雨，\n阳台的衣服永远差一天干。' },
  { title:'七月 · 夏夜', date:'2026.07', emoji:'🎆', sky:['#1f2a56','#6b4f86'],
    text:'西瓜、蝉鸣、晚风，\n天上一朵接一朵的烟火。' },
  { title:'八月 · 蝉鸣', date:'2026.08', emoji:'🌻', sky:['#f6c04a','#fbeea8'],

  { title:'九月 · 中秋', date:'2026.09', emoji:'🌕', sky:['#28304f','#c99a5b'],
    text:'一家人坐在阳台上分月饼，\n月亮圆得刚刚好。' },
  { title:'十月 · 银杏', date:'2026.10', emoji:'🍂', sky:['#f0c058','#fbe7b0'],
    text:'就是这条路。\n踩着落叶走了很久，沙沙声像在说话。' },
  { title:'十一月 · 落叶', date:'2026.11', emoji:'🍁', sky:['#e39d55','#f8dcae'],
    text:'叶子掉得最凶的一周，\n扫地的师傅比谁都忙。' },
  { title:'十二月 · 雪夜', date:'2026.12', emoji:'🕯️', sky:['#2b3352','#8d93b0'],
    text:'给这一年画个句号。\n愿明年的秋天，也有人陪你踩落叶。' },
];

/* ---------- 十二个月的歌（网页实时合成，不需要音频文件） ---------- */
/* mel：旋律。数字是音阶级数，*2 表示两拍，_ 表示休止；chords：和弦级数，每个 4 拍 */
const SONGS = [
  { name:'初雪',      bpm:58, root:60, scale:'min', tone:'bell',  mel:'0*2 4 2 0*2 2 4 5*2 4 2*2 0 -1 0*2', chords:'0 5 2 6' },
  { name:'早梅',      bpm:66, root:62, scale:'maj', tone:'bell',  mel:'4*2 2 0 2*2 4 5 4*2 2*2 0*2', chords:'0 3 4 0' },
  { name:'樱花',      bpm:74, root:65, scale:'maj', tone:'piano', mel:'0 2 4 5 4 2 0 2 4 5 7 5 4 2 4 0', chords:'0 5 3 4' },
  { name:'新绿',      bpm:78, root:64, scale:'maj', tone:'flute', mel:'2 4 5 4 2 0 4 2 5 4 2 0 2 4 2 0', chords:'5 3 0 4' },
  { name:'海风',      bpm:88, root:67, scale:'maj', tone:'piano', mel:'0 4 4 5 5 4*2 2 2 0 0 4 4 5 4*2', chords:'0 4 5 3' },
  { name:'梅雨',      bpm:70, root:62, scale:'min', tone:'bell',  mel:'0 -3 2 0 -3 2 4 2 0 -3 2 -5 0*2', chords:'0 3 5 4' },
  { name:'夏夜',      bpm:92, root:65, scale:'maj', tone:'piano', mel:'0 2 4 7 4 2 0 2 4 7 9 7 4 2 0 2', chords:'0 5 3 4' },
  { name:'蝉鸣',      bpm:84, root:62, scale:'mix', tone:'flute', mel:'0 2 4 5 4 2 0 -1 0 2 4 7 4 2 0*2', chords:'0 6 3 4' },

const DB_NAME='ginkgo-walk-db', DB_VER=1, LS_KEY='ginkgo-walk-v2';
const Store = {
  mode:'none', db:null, data:{},
  async init(){
    try{
      this.db = await new Promise((res,rej)=>{
        const rq=indexedDB.open(DB_NAME,DB_VER);
        rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains('signs')) db.createObjectStore('signs',{keyPath:'id'}); };
        rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); rq.onblocked=()=>rej(new Error('blocked'));
      });
      const all = await new Promise((res,rej)=>{
        const tx=this.db.transaction('signs','readonly'); const rq=tx.objectStore('signs').getAll();
        rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error);
      });
      all.forEach(r=>{ this.data[r.id]=r; });
      this.mode='idb';
    }catch(e){
      try{ this.data = JSON.parse(localStorage.getItem(LS_KEY)||'{}'); this.mode='local'; }
      catch(e2){ this.data={}; this.mode='none'; }
    }
  },
  rec(i){
    const base = { id:i, title:MONTHS[i].title, date:MONTHS[i].date, text:MONTHS[i].text, photos:[], audio:null, audioName:'' };
    const r = Object.assign(base, this.data[i]||{});
    if (!Array.isArray(r.photos)) r.photos=[];
    return r;
  },
  async put(rec){
    this.data[rec.id]=rec;
    if (this.mode==='idb'){
      try{
        await new Promise((res,rej)=>{
          const tx=this.db.transaction('signs','readwrite'); tx.objectStore('signs').put(rec);
          tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
        });
        return true;
      }catch(e){ this.mode='local'; }
    }
    if (this.mode==='local'||this.mode==='none'){
      try{
        const slim={}; for (const k in this.data){ const r=this.data[k]; slim[k]={ id:r.id, title:r.title, date:r.date, text:r.text, photos:(r.photos||[]).slice(0,2), audioName:r.audioName||'' }; }
        localStorage.setItem(LS_KEY, JSON.stringify(slim)); this.mode='local'; return true;
      }catch(e){ return false; }
    }
    return false;
  }
};

let AC=null, master=null, noiseBuf=null, soundOn=true;
function ensureAudio(){
  if (AC){ if (AC.state==='suspended') AC.resume(); return AC; }
  try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; }
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  const len = AC.sampleRate*2; noiseBuf = AC.createBuffer(1,len,AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
  const wg=AC.createGain(); wg.gain.value=.07;
  const lfo=AC.createOscillator(); lfo.frequency.value=.11; const lg=AC.createGain(); lg.gain.value=.05;
  lfo.connect(lg).connect(wg.gain); src.connect(lp).connect(wg).connect(master); src.start(); lfo.start();
  return AC;
}
function rustle(vol, bright){
  if (!AC || !soundOn) return;
  const t = AC.currentTime, grains = bright ? 5 : 4;
  for (let k=0;k<grains;k++){
    const src=AC.createBufferSource(); src.buffer=noiseBuf;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(bright?3600:2300)+Math.random()*2200; bp.Q.value=.6+Math.random()*1.2;
    const g=AC.createGain(); const st=t+k*.028+Math.random()*.02, dur=.06+Math.random()*.13;
    g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(Math.max(.002,vol*(.5+Math.random()*.7)),st+.008);
    g.gain.exponentialRampToValueAtTime(.0001,st+dur);
    src.connect(bp).connect(g).connect(master); src.start(st, Math.random()*1.6, dur+.05);
  }
}
function chime(){
  if (!AC || !soundOn) return;
  const t=AC.currentTime;
  [659.25, 987.77, 1318.5].forEach((f,k)=>{
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=AC.createGain(); const st=t+k*.12;
    g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(.12,st+.02); g.gain.exponentialRampToValueAtTime(.0001,st+1.4);
    o.connect(g).connect(master); o.start(st); o.stop(st+1.5);
  });
}
$('btnSound').onclick = ()=>{
  soundOn=!soundOn; $('btnSound').textContent = soundOn?'🔊':'🔇';
  if (master) master.gain.value = soundOn ? .9 : 0;

/* ---------- 曲谱解析 ---------- */
const midiToFreq = m=>440*Math.pow(2,(m-69)/12);
function degToMidi(scale, root, d){
  const n=scale.length, o=Math.floor(d/n), i=((d%n)+n)%n;
  return root+12*o+scale[i];
}
function parseMel(str){
  const notes=[]; let b=0;
  for (const tok of str.trim().split(/\s+/)){
    if (!tok) continue;
    const m=/^(_)?(-?\d+)?(?:\*([\d.]+))?$/.exec(tok);
    if (!m) continue;
    const rest=!!m[1], deg=m[2]!==undefined?parseInt(m[2],10):0, len=m[3]?parseFloat(m[3]):1;
    if (!rest) notes.push({beat:b, deg, len});
    b+=len;
  }
  return {notes, beats:b};
}
function buildSong(idx){
  const def=SONGS[idx], scale=SCALES[def.scale]||SCALES.maj;
  const {notes, beats}=parseMel(def.mel);
  const chords=def.chords.trim().split(/\s+/).map(n=>parseInt(n,10));
  const cb=4, progLen=chords.length*cb;
  const loop=Math.max(beats, progLen);
  const events=[];
  notes.forEach(n=>events.push({step:n.beat, kind:'mel', midi:degToMidi(scale,def.root,n.deg), dur:n.len}));
  for (let base=0; base<loop; base+=progLen){
    chords.forEach((cd,k)=>{
      const start=base+k*cb; if (start>=loop) return;
      [0,2,4].forEach(off=>{
        events.push({step:start, kind:'pad', midi:degToMidi(scale, def.root-12, cd+off), dur:cb});
      });
    });
  }
  const steps=Math.ceil(loop*2);
  const byStep={}; events.forEach(e=>{ const s=Math.round(e.step*2); (byStep[s]||(byStep[s]=[])).push(e); });
  return { byStep, steps, beatDur:60/def.bpm, tone:def.tone, def };
}

const Player = {
  on:false, idx:-1, mode:'', song:null, gain:null, send:null, timer:0, step:0, next:0,
  el:null, elUrl:'', fadeTimer:0,

  /* 内置合成曲 */
  playBuiltin(idx){
    ensureAudio(); if (!AC) return;
    this.stop(true);
    this.idx=idx; this.mode='builtin';
    this.song=buildSong(idx);
    const g=AC.createGain(); g.gain.value=0; g.connect(master);
    const dl=AC.createDelay(1.0); dl.delayTime.value=.31;
    const fb=AC.createGain(); fb.gain.value=.26;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800;
    dl.connect(lp).connect(fb).connect(dl); dl.connect(g);
    const send=AC.createGain(); send.gain.value=.42; send.connect(dl);
    this.gain=g; this.send=send;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(.85, AC.currentTime+1.5);
    this.step=0; this.next=AC.currentTime+.12;
    this.timer=setInterval(()=>this.tick(), 45);
    this.on=true;
  },
  tick(){
    if (!this.on || this.mode!=='builtin' || !AC) return;
    const ahead=AC.currentTime+.4;
    let guard=0;
    while (this.next<ahead && guard++<40){
      const evs=this.song.byStep[this.step];
      if (evs) for (const e of evs){
        if (e.kind==='mel') this.voiceMel(e.midi, this.next, e.dur*this.song.beatDur);
        else this.voicePad(e.midi, this.next, e.dur*this.song.beatDur);
      }
      this.next += this.song.beatDur*.5;
      this.step = (this.step+1) % this.song.steps;
    }
  },
  voiceMel(midi, t, dur){
    if (!AC || !this.gain) return;
    const f=midiToFreq(midi), tone=this.song.tone;
    const g=AC.createGain(); g.connect(this.gain); if (this.send) g.connect(this.send);
    const end=t+Math.max(.4, dur*1.5);
    if (tone==='flute'){
      const o=AC.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const vib=AC.createOscillator(); vib.frequency.value=5.2;
      const vg=AC.createGain(); vg.gain.value=f*0.006; vib.connect(vg).connect(o.frequency);
      o.connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.19,t+.09);
      g.gain.setValueAtTime(.19,t+Math.max(.12,dur*.7)); g.gain.exponentialRampToValueAtTime(.0008,t+dur+.35);
      o.start(t); vib.start(t); o.stop(t+dur+.4); vib.stop(t+dur+.4);
    } else if (tone==='piano'){
      const o1=AC.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
      const o2=AC.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
      const g2=AC.createGain(); g2.gain.value=.3;
      const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
      o1.connect(lp); o2.connect(g2).connect(lp); lp.connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.2,t+.008);
      g.gain.exponentialRampToValueAtTime(.001, t+Math.max(.5,dur*1.7));
      o1.start(t); o2.start(t); o1.stop(end+.4); o2.stop(end+.4);
    } else { /* bell */
      const o1=AC.createOscillator(); o1.type='sine'; o1.frequency.value=f;
      const o2=AC.createOscillator(); o2.type='triangle'; o2.frequency.value=f*2.01;
      const g2=AC.createGain(); g2.gain.value=.22;
      o1.connect(g); o2.connect(g2).connect(g);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.01);
      g.gain.exponentialRampToValueAtTime(.0008, t+Math.max(.6,dur*1.9));
      o1.start(t); o2.start(t); o1.stop(end+.8); o2.stop(end+.8);
    }
  },
  voicePad(midi, t, dur){
    if (!AC || !this.gain) return;
    const f=midiToFreq(midi);
    const o1=AC.createOscillator(); o1.type='sine'; o1.frequency.value=f;
    const o2=AC.createOscillator(); o2.type='triangle'; o2.frequency.value=f*1.004;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1000;
    const g=AC.createGain(); o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.gain);
    const a=Math.min(.6,dur*.45);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.055,t+a*.6);
    g.gain.setValueAtTime(.055, t+Math.max(a, dur*.75));
    g.gain.exponentialRampToValueAtTime(.0008, t+dur+.2);
    o1.start(t); o2.start(t); o1.stop(t+dur+.3); o2.stop(t+dur+.3);
  },

  /* 自己的音乐文件 */
  playFile(idx, blob){
    this.stop(true);
    this.idx=idx; this.mode='file';
    const url=URL.createObjectURL(blob);
    const el=new Audio(url); el.loop=true; el.volume=0;
    this.el=el; this.elUrl=url;
    const p=el.play(); if (p && p.catch) p.catch(()=>{});
    const t0=performance.now();
    clearInterval(this.fadeTimer);
    this.fadeTimer=setInterval(()=>{
      const k=Math.min(1,(performance.now()-t0)/1200);
      if (this.el) this.el.volume=.85*k; else clearInterval(this.fadeTimer);
      if (k>=1) clearInterval(this.fadeTimer);
    },60);
    this.on=true;
  },
  stop(silent){
    const was=this.on;
    this.on=false; this.idx=-1;
    clearInterval(this.timer); this.timer=0;
    if (this.mode==='builtin' && this.gain && AC){
      const g=this.gain, t=AC.currentTime;
      try{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t);
        g.gain.linearRampToValueAtTime(0,t+.8); }catch(e){}
      setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 1000);
      this.gain=null; this.send=null;
    }
    if (this.mode==='file'){
      const el=this.el, url=this.elUrl;
      clearInterval(this.fadeTimer);
      if (el){
        const t0=performance.now(); const v0=el.volume;
        const iv=setInterval(()=>{
          const k=Math.min(1,(performance.now()-t0)/700);
          try{ el.volume=Math.max(0,v0*(1-k)); }catch(e){}
          if (k>=1){ clearInterval(iv); el.pause(); URL.revokeObjectURL(url); }
        },50);
      }
      this.el=null; this.elUrl='';
    }
    this.mode='';
    if (!silent && was) toast('音乐已停');
  }
};

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
let lastStep=0, kickSoundT=0, foundCount=0, awayTimer=0;
const fwd=new THREE.Vector3(), right=new THREE.Vector3();

function update(dt, t){
  let ix=0, iz=0, run=false;
  if (started){
    if (keys.KeyW||keys.ArrowUp) iz+=1;
    if (keys.KeyS||keys.ArrowDown) iz-=1;
    if (keys.KeyA||keys.ArrowLeft) ix-=1;
    if (keys.KeyD||keys.ArrowRight) ix+=1;
    run = keys.ShiftLeft||keys.ShiftRight;
    if (joy.id!==null){ ix+=joy.x; iz-=joy.y; if (Math.hypot(joy.x,joy.y)>.92) run=true; }
  }
  const il=Math.hypot(ix,iz); if (il>1){ ix/=il; iz/=il; }
  const speed = run ? 6.2 : 3.1;
  fwd.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  right.set(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  let tx=(fwd.x*iz+right.x*ix)*speed, tz=(fwd.z*iz+right.z*ix)*speed;
  if (started && auto.on){
    if (joy.id!==null && Math.hypot(joy.x,joy.y)>.3) setAuto(false);
    else {
      let targetZ, lookYaw=0;
      if (auto.next<N){ const s=signs[auto.next]; targetZ=s.z+2.6; }
      else targetZ=-ROAD_LEN+2;
      if (auto.state==='walk'){
        const dz=targetZ-player.z, dx=0-player.x;
        const v=Math.min(2.6, Math.max(.6, Math.abs(dz)*.9));
        const len=Math.hypot(dx,dz)||1;
        tx=dx/len*v; tz=dz/len*v;
        if (Math.abs(dz)<.25){
          tx=tz=0;
          if (auto.next<N) arriveAt(auto.next);
          else { auto.state='end'; }
        }
      } else { tx=0; tz=0; }
      // 镜头：走路时看前方，停下时转向路牌，终点看文字
      if (auto.state==='stop' && auto.next<N){
        const s=signs[auto.next]; lookYaw=Math.atan2(-(s.x-player.x), -(s.z-player.z))*.75;
        auto.wait-=dt;
        $('autoCount').textContent = Player.on ? '正在听歌，听完点继续' : `${Math.max(0,Math.ceil(auto.wait))} 秒后自动继续`;
        if (!Player.on && auto.wait<=0) continueWalk();
      }
      if (!locked && look.id===null){
        let dy=lookYaw-player.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
        player.yaw+=dy*Math.min(1,dt*2.2);
        player.pitch+=((auto.state==='end'?.12:0)-player.pitch)*Math.min(1,dt*2);
      }
    }
  }
  const a=1-Math.exp(-9*dt);
  player.vx+=(tx-player.vx)*a; player.vz+=(tz-player.vz)*a;
  player.x+=player.vx*dt; player.z+=player.vz*dt;
  for (const c of colliders){
    const dx=player.x-c.x, dz=player.z-c.z, rr=c.r+.3;
    if (Math.abs(dz)>rr||Math.abs(dx)>rr) continue;
    const d=Math.hypot(dx,dz);
    if (d<rr && d>1e-4){ player.x=c.x+dx/d*rr; player.z=c.z+dz/d*rr; }
  }
  player.x=Math.max(-16,Math.min(16,player.x));
  player.z=Math.max(-ROAD_LEN-6,Math.min(9,player.z));
  const spd=Math.hypot(player.vx,player.vz);

  if (spd>.4){
    player.phase += dt*spd*2.1;
    const step=Math.floor(player.phase/Math.PI);
    if (step!==lastStep){ lastStep=step; rustle(run?.32:.22, false); }
  }
  const bob = Math.sin(player.phase*2)*.045*Math.min(1,spd/3);
  camera.position.set(player.x, EYE+bob, player.z);
  camera.rotation.set(player.pitch, player.yaw, Math.sin(player.phase)*.006*Math.min(1,spd/3));
  sky.position.copy(camera.position);
  sun.position.copy(camera.position).addScaledVector(sunDir,250);

  // 地上落叶被踢散
  const moving=spd>.6, kr=.65+spd*.12, kr2=kr*kr;
  let changed=false, kicked=0;
  for (let i=0;i<NG;i++){
    const i3=i*3;
    if (gState[i]===0){
      if (!moving) continue;
      const dz=gPos[i3+2]-player.z; if (dz>kr||dz<-kr) continue;
      const dx=gPos[i3]-player.x; if (dx>kr||dx<-kr) continue;
      const d2=dx*dx+dz*dz; if (d2>kr2) continue;
      const d=Math.sqrt(d2)||.01, power=Math.min(1.6, spd/3.1);
      gVel[i3]=dx/d*rand(.6,1.6)*power+player.vx*rand(.3,.7);
      gVel[i3+2]=dz/d*rand(.6,1.6)*power+player.vz*rand(.3,.7);
      gVel[i3+1]=rand(.9,2.2)*power+.4;
      gAng[i3]=rand(-9,9); gAng[i3+1]=rand(-5,5); gAng[i3+2]=rand(-9,9);
      gState[i]=1; kicked++;
    }
    const drag=1-Math.min(1,1.6*dt);
    gVel[i3+1]-=4.2*dt; if (gVel[i3+1]<-.85) gVel[i3+1]=-.85;
    gVel[i3]=gVel[i3]*drag+Math.sin(t*4+i)*.8*dt; gVel[i3+2]=gVel[i3+2]*drag+Math.cos(t*3.3+i)*.8*dt;
    gPos[i3]+=gVel[i3]*dt; gPos[i3+1]+=gVel[i3+1]*dt; gPos[i3+2]+=gVel[i3+2]*dt;
    gRot[i3]+=gAng[i3]*dt; gRot[i3+1]+=gAng[i3+1]*dt; gRot[i3+2]+=gAng[i3+2]*dt;
    if (gPos[i3+1]<=gRest[i] && gVel[i3+1]<0){
      gPos[i3+1]=gRest[i]; gState[i]=0; gRot[i3]=rand(-.15,.15); gRot[i3+2]=rand(-.15,.15);
    }
    setLeaf(groundLeaves,gPos,gRot,gScl,i); changed=true;
  }
  if (changed) groundLeaves.instanceMatrix.needsUpdate=true;
  if (kicked>0 && t-kickSoundT>.09){ kickSoundT=t; rustle(Math.min(.45,.12+kicked*.03), true); }

  // 飘落的叶子
  for (let i=0;i<NF;i++){
    const i3=i*3, i4=i*4;
    const fs=fPar[i4], ph=fPar[i4+1], fr=fPar[i4+2], amp=fPar[i4+3];
    fPos[i3+1]-=fs*dt;
    fPos[i3]+=Math.sin(t*fr+ph)*amp*dt+.25*dt;
    fPos[i3+2]+=Math.cos(t*fr*.8+ph)*amp*.6*dt;
    fRot[i3]=Math.sin(t*fr+ph)*1.1; fRot[i3+1]=t*.6*fr+ph; fRot[i3+2]=Math.cos(t*fr*1.2+ph)*.9;
    const dx=fPos[i3]-player.x, dz=fPos[i3+2]-player.z;
    if (fPos[i3+1]<.03 || dx*dx+dz*dz>34*34) respawnFall(i,player.x,player.z, fPos[i3+1]>=.03);
    setLeaf(fallLeaves,fPos,fRot,fScl,i);
  }
  fallLeaves.instanceMatrix.needsUpdate=true;

  // 浮尘
  for (let i=0;i<ND;i++){
    const i3=i*3;
    dPos[i3]+=Math.sin(t*.3+i)*.05*dt; dPos[i3+1]+=Math.sin(t*.5+i*1.7)*.04*dt; dPos[i3+2]+=Math.cos(t*.27+i)*.05*dt;
    if (dPos[i3]-player.x>14) dPos[i3]-=28; else if (dPos[i3]-player.x<-14) dPos[i3]+=28;
    if (dPos[i3+2]-player.z>14) dPos[i3+2]-=28; else if (dPos[i3+2]-player.z<-14) dPos[i3+2]+=28;
  }
  dustGeo.attributes.position.needsUpdate=true;

  // 路牌
  let near=-1, nd=5.5;
  for (let i=0;i<N;i++){
    const s=signs[i], d=Math.hypot(player.x-s.x, player.z-s.z);
    s.glow.material.opacity = s.visited ? .32 : .5+.45*Math.sin(t*3+i);
    s.glow.position.y = 3.05+Math.sin(t*2+i)*.08;
    if (d<nd){ nd=d; near=i; }
  }
  activeSign=near;
  if (!auto.on && near>=0){
    const s=signs[near];
    if (!s.visited){
      s.visited=true; foundCount++; dots[near].classList.add('on'); $('found').textContent=foundCount; chime();
      toast(foundCount===N ? '🎉 十二个月都找到了' : `✨ 记忆路牌 ${String(near+1).padStart(2,'0')} · ${MONTHS[near].title.split('·')[1]||''}`);
    }
    if (shownSign!==near) showCard(near);
  } else if (!auto.on && shownSign>=0) hideCard();

  // 走远了就停音乐
  if (Player.on && Player.idx>=0){
    const s=signs[Player.idx];
    if (Math.hypot(player.x-s.x, player.z-s.z) > 15){
      awayTimer+=dt;
      if (awayTimer>1.0){ awayTimer=0; Player.stop(); updateMusicUI(); toast('走远了，音乐已停'); }
    } else awayTimer=0;
  }

  // 最后数米，散开的金叶汇聚成祝福文字
  const endDistance=Math.max(0,Math.min(1,(Math.abs(player.z+ROAD_LEN-9)-30)/30));
  const assemble=1-endDistance;
  finaleGroup.position.set(0,0,-ROAD_LEN-12);
  finaleGroup.scale.setScalar(.72);
  finaleGroup.rotation.y=0;
  finaleCaption.classList.toggle('show',player.z < -ROAD_LEN+14);
  if (player.z < -ROAD_LEN+14 && !window.__finaleToast){ window.__finaleToast=true; toast('走到尽头了，抬头看看'); chime(); }
  for(let i=0;i<finaleCount;i++){
    const i3=i*3, a=assemble;
    const driftX=Math.sin(t*.7+finalePhase[i])*5*(1-a), driftY=Math.cos(t*.9+finalePhase[i])*2*(1-a);
    finalePos[i3]+=(finaleTarget[i3]+driftX-finalePos[i3])*(.02+a*.10);
    finalePos[i3+1]+=(finaleTarget[i3+1]+driftY-finalePos[i3+1])*(.02+a*.10);
    finalePos[i3+2]+=(finaleTarget[i3+2]-finalePos[i3+2])*(.02+a*.10);
    finaleRot[i3]+=(Math.sin(t+finalePhase[i])*(1-a))*dt;
    finaleRot[i3+1]+=dt*(.25+a*.03);
    finaleRot[i3+2]+=(Math.cos(t+finalePhase[i])*(1-a))*dt;
    setLeaf(finaleMesh,finalePos,finaleRot,finaleScale,i);
  }
  finaleMesh.instanceMatrix.needsUpdate=true;

  const prog=Math.max(0,Math.min(1,(6-player.z)/(6+ROAD_LEN)));
  $('fill').style.width=(prog*100)+'%';
  $('meters').textContent=Math.max(0,Math.round(6-player.z));
}

function loop(){
  const dt=Math.min(clock.getDelta(), .05), t=clock.elapsedTime;
  if (!started){ player.yaw = Math.sin(t*.15)*.25; }
  update(dt, t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});
updateMusicUI();
loop();
</script>
</body>
